<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Living Archive - Login</title>
<!-- Typography & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed": "#c5eadf",
                    "on-tertiary": "#ffffff",
                    "surface": "#fbfbe2",
                    "tertiary-fixed-dim": "#e3beb8",
                    "on-tertiary-container": "#b99791",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#f2f2d9",
                    "on-secondary": "#ffffff",
                    "outline-variant": "#c1c8c4",
                    "on-tertiary-fixed-variant": "#5b403c",
                    "secondary-fixed-dim": "#78dc77",
                    "tertiary-fixed": "#ffdad4",
                    "on-secondary-container": "#00731e",
                    "surface-container-high": "#eaead1",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed": "#002204",
                    "on-primary": "#ffffff",
                    "outline": "#717976",
                    "inverse-primary": "#aacec3",
                    "tertiary-container": "#48302c",
                    "on-secondary-fixed-variant": "#005313",
                    "on-primary-fixed": "#00201a",
                    "secondary-fixed": "#94f990",
                    "tertiary": "#301b17",
                    "inverse-surface": "#303221",
                    "surface-tint": "#43655c",
                    "on-primary-fixed-variant": "#2b4d44",
                    "surface-bright": "#fbfbe2",
                    "secondary-container": "#91f78e",
                    "primary-container": "#1a3c34",
                    "on-primary-container": "#83a69c",
                    "primary": "#01261f",
                    "on-surface": "#1b1d0e",
                    "surface-variant": "#e4e4cc",
                    "surface-container-low": "#f5f5dc",
                    "on-surface-variant": "#414846",
                    "on-tertiary-fixed": "#2b1613",
                    "primary-fixed-dim": "#aacec3",
                    "secondary": "#006e1c",
                    "surface-container": "#efefd7",
                    "error": "#ba1a1a",
                    "surface-dim": "#dbdcc3",
                    "on-error-container": "#93000a",
                    "background": "#fbfbe2",
                    "on-background": "#1b1d0e",
                    "error-container": "#ffdad6",
                    "surface-container-highest": "#e4e4cc"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "spacing": {},

                    "headline": [
                            "Noto Serif"

                    "body": [

            }
    },
        },
      }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface antialiased font-body min-h-screen selection:bg-secondary selection:text-on-secondary">
<!-- Main Container -->
<main class="relative min-h-screen w-full flex items-center justify-center p-4 md:p-8 overflow-hidden">
<!-- Background Image with Tonal Overlay -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover scale-105" data-alt="stunning high-contrast aerial photo of the Uraba coastline with deep green jungle meeting dark blue ocean at sunset" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB2q159pqtC65tslTwzA3XPKWEV8aeGTnjPeI4jGQ_pMHqWdCW9HHbG0vzffNGYAgBoRJgfOERJcNyW04hthp0cyODecEDjJdflVDVe7uvs5QMtbfnVJs_3WHFnRPiiThPSaRzB5mkitBcZNGvByOMgQX-y09JG3gAZpET-7icAuqCIS2aPvpe8RWgqqFkZfnTSeLR1I74Wysl-lI-09A5xVXNjGGAsCzM3CvnLwhYfLQRr6aLDLhtHyUPVjFJBdLs17s2TJdNenTJQ"/>
<!-- Ambient depth gradient -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/80 via-primary-container/40 to-tertiary/60 mix-blend-multiply"></div>
</div>
<!-- Glassmorphism Login Card -->
<div class="relative z-10 w-full max-w-[440px] bg-surface-variant/65 backdrop-blur-[24px] rounded-[1.5rem] p-8 sm:p-10 flex flex-col gap-10 shadow-[0_16px_40px_rgba(27,29,14,0.15)] ring-1 ring-surface-lowest/20">
<!-- Header Section -->
<header class="flex flex-col gap-2 text-center items-center">
<!-- Decorative botanical element -->
<span class="material-symbols-outlined text-secondary text-3xl mb-2" style="font-variation-settings: 'FILL' 1;">eco</span>
<h1 class="font-headline text-4xl text-primary font-bold tracking-tight">The Living Archive</h1>
<p class="font-body text-base text-on-surface-variant font-medium mt-1">Access the botanical journal.</p>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Inputs Container -->
<div class="flex flex-col gap-5">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label text-sm font-bold text-tertiary ml-1 tracking-wide" for="email">Email Address</label>
<input class="w-full bg-surface-container-highest text-on-surface font-body text-base px-5 py-4 rounded-xl border-none focus:ring-2 focus:ring-secondary/40 outline-none transition-all duration-500 ease-in-out placeholder:text-on-surface-variant/50" id="email" placeholder="explorer@archive.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end ml-1 mb-0.5">
<label class="font-label text-sm font-bold text-tertiary tracking-wide" for="password">Password</label>
<a class="font-label text-xs font-bold text-secondary hover:text-primary transition-colors duration-500" href="#">Forgot Password?</a>
</div>
<input class="w-full bg-surface-container-highest text-on-surface font-body text-base px-5 py-4 rounded-xl border-none focus:ring-2 focus:ring-secondary/40 outline-none transition-all duration-500 ease-in-out placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions Container -->
<div class="flex flex-col gap-4 mt-2">
<!-- Primary Button (Cacao Brown / Tertiary) -->
<button class="w-full bg-tertiary text-on-tertiary font-label font-bold text-base tracking-wide py-4 rounded-full shadow-[inset_0_2px_0_rgba(255,255,255,0.15),0_8px_20px_rgba(48,27,23,0.2)] hover:bg-[#40241f] hover:translate-y-[-1px] transition-all duration-500 ease-in-out flex justify-center items-center gap-2 group" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-lg opacity-0 -ml-4 group-hover:opacity-100 group-hover:ml-0 transition-all duration-500 ease-in-out">arrow_forward</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-4 my-2 opacity-80">
<div class="flex-1 h-px bg-on-surface-variant/20"></div>
<span class="font-label text-[10px] text-on-surface-variant font-bold uppercase tracking-widest">or</span>
<div class="flex-1 h-px bg-on-surface-variant/20"></div>
</div>
<!-- Secondary Button (Google) -->
<button class="w-full bg-surface-container-highest text-on-surface font-label font-bold text-base tracking-wide py-4 rounded-full flex items-center justify-center gap-3 hover:bg-surface-variant hover:shadow-[0_4px_12px_rgba(27,29,14,0.05)] transition-all duration-500 ease-in-out" type="button">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Continue with Google
                    </button>
</div>
</form>
<!-- Footer Link -->
<footer class="text-center mt-2">
<p class="font-body text-sm text-on-surface-variant font-medium">
                    New to the archive? 
                    <a class="font-label font-bold text-primary hover:text-secondary hover:underline underline-offset-4 decoration-2 transition-all duration-300 ml-1" href="#">Create Account</a>
</p>
</footer>
</div>
</main>
</body></html>

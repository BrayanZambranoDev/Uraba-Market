<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Delivery Address - The Living Archive</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400..900;1,400..900&amp;family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed": "#c5eadf",
                      "on-tertiary": "#ffffff",
                      "surface": "#fbfbe2",
                      "tertiary-fixed-dim": "#e3beb8",
                      "on-tertiary-container": "#b99791",
                      "on-error": "#ffffff",
                      "inverse-on-surface": "#f2f2d9",
                      "on-secondary": "#ffffff",
                      "outline-variant": "#c1c8c4",
                      "on-tertiary-fixed-variant": "#5b403c",
                      "secondary-fixed-dim": "#78dc77",
                      "tertiary-fixed": "#ffdad4",
                      "on-secondary-container": "#00731e",
                      "surface-container-high": "#eaead1",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed": "#002204",
                      "on-primary": "#ffffff",
                      "outline": "#717976",
                      "inverse-primary": "#aacec3",
                      "tertiary-container": "#48302c",
                      "on-secondary-fixed-variant": "#005313",
                      "on-primary-fixed": "#00201a",
                      "secondary-fixed": "#94f990",
                      "tertiary": "#301b17",
                      "inverse-surface": "#303221",
                      "surface-tint": "#43655c",
                      "on-primary-fixed-variant": "#2b4d44",
                      "surface-bright": "#fbfbe2",
                      "secondary-container": "#91f78e",
                      "primary-container": "#1a3c34",
                      "on-primary-container": "#83a69c",
                      "primary": "#01261f",
                      "on-surface": "#1b1d0e",
                      "surface-variant": "#e4e4cc",
                      "surface-container-low": "#f5f5dc",
                      "on-surface-variant": "#414846",
                      "on-tertiary-fixed": "#2b1613",
                      "primary-fixed-dim": "#aacec3",
                      "secondary": "#006e1c",
                      "surface-container": "#efefd7",
                      "error": "#ba1a1a",
                      "surface-dim": "#dbdcc3",
                      "on-error-container": "#93000a",
                      "background": "#fbfbe2",
                      "on-background": "#1b1d0e",
                      "error-container": "#ffdad6",
                      "surface-container-highest": "#e4e4cc"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "2xl": "1.5rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Noto Serif", "serif"],
                      "body": ["Manrope", "sans-serif"],
                      "label": ["Manrope", "sans-serif"]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        /* Hide scrollbar for clean aesthetic if needed */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen antialiased flex flex-col items-center pb-12">
<!-- Header Section (Transactional Flow - No Global Nav) -->
<header class="w-full max-w-2xl px-6 pt-8 pb-6 flex items-center justify-between z-10 relative">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest text-primary hover:bg-surface-variant transition-colors duration-500 ease-in-out">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline text-lg font-bold text-primary tracking-tight">Checkout</div>
<div class="w-12 h-12"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Area -->
<main class="w-full max-w-2xl px-6 flex-1 flex flex-col">
<!-- Typography Anchor & Context -->
<div class="mb-10">
<h1 class="font-headline text-4xl md:text-5xl text-primary font-bold mb-3 tracking-tight">Delivery Address</h1>
<p class="font-body text-on-surface-variant text-base md:text-lg max-w-md">Provide your location details for secure delivery within the Urabá region.</p>
</div>
<!-- Form Canvas (Tonal Layering: surface-container-lowest on surface) -->
<form class="bg-surface-container-lowest rounded-2xl p-6 md:p-8 flex flex-col gap-6 w-full relative z-10">
<!-- Input: Name -->
<div class="flex flex-col gap-2">
<label class="font-label text-sm font-bold text-tertiary px-1 uppercase tracking-wider text-[11px]" for="fullName">Full Name</label>
<input class="w-full bg-surface-container-highest border-0 rounded-xl px-4 py-4 text-on-surface placeholder:text-outline-variant font-body focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-300" id="fullName" placeholder="e.g., Maria Montoya" type="text"/>
</div>
<!-- Input: Phone -->
<div class="flex flex-col gap-2">
<label class="font-label text-sm font-bold text-tertiary px-1 uppercase tracking-wider text-[11px]" for="phone">Phone Number</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="call">call</span>
</span>
<input class="w-full bg-surface-container-highest border-0 rounded-xl pl-12 pr-4 py-4 text-on-surface placeholder:text-outline-variant font-body focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-300" id="phone" placeholder="+57 300 000 0000" type="tel"/>
</div>
</div>
<!-- Input: Municipality Dropdown -->
<div class="flex flex-col gap-2">
<label class="font-label text-sm font-bold text-tertiary px-1 uppercase tracking-wider text-[11px]" for="municipality">Municipality (Urabá Region)</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-highest border-0 rounded-xl px-4 py-4 text-on-surface font-body focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-300" id="municipality">
<option class="text-outline-variant" disabled="" selected="" value="">Select your municipality...</option>
<option value="Turbo">Turbo</option>
<option value="Apartadó">Apartadó</option>
<option value="Chigorodó">Chigorodó</option>
<option value="Carepa">Carepa</option>
<option value="Mutatá">Mutatá</option>
<option value="Necoclí">Necoclí</option>
<option value="San Juan de Urabá">San Juan de Urabá</option>
<option value="San Pedro de Urabá">San Pedro de Urabá</option>
<option value="Arboletes">Arboletes</option>
</select>
<span class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-primary">
<span class="material-symbols-outlined" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</span>
</div>
</div>
<!-- Input: Street Address -->
<div class="flex flex-col gap-2">
<label class="font-label text-sm font-bold text-tertiary px-1 uppercase tracking-wider text-[11px]" for="street">Street Address</label>
<input class="w-full bg-surface-container-highest border-0 rounded-xl px-4 py-4 text-on-surface placeholder:text-outline-variant font-body focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-300" id="street" placeholder="Street, Cra, Barrio..." type="text"/>
</div>
<!-- Input: Additional Info (Optional) -->
<div class="flex flex-col gap-2">
<label class="font-label text-sm font-bold text-tertiary px-1 uppercase tracking-wider text-[11px]" for="details">Additional Details (Optional)</label>
<input class="w-full bg-surface-container-highest border-0 rounded-xl px-4 py-4 text-on-surface placeholder:text-outline-variant font-body focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-300" id="details" placeholder="Apt, suite, or delivery instructions" type="text"/>
</div>
<!-- Primary Action Button -->
<div class="pt-6 pb-2">
<button class="w-full rounded-full bg-primary text-on-primary py-4 px-8 font-label font-bold text-base tracking-wide flex items-center justify-center gap-2 shadow-[inset_0_2px_0_rgba(255,255,255,0.15)] hover:bg-primary-container hover:text-on-primary-container transition-all duration-600 ease-in-out" type="button">
                    Save Address
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Decorative Organic Element (Subtle background texture) -->
<div class="fixed top-0 left-0 w-full h-[353px] bg-gradient-to-b from-surface-container-high/50 to-surface pointer-events-none -z-10"></div>
</main>
</body></html>

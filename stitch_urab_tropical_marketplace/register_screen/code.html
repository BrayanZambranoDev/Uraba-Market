<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - The Living Archive</title>

<style>
        /* Smooth, liquid transitions */
        .transition-liquid {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 500ms;
        }
        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased min-h-screen relative overflow-x-hidden selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Immersive Background -->
<div class="fixed inset-0 z-0">
<img alt="Cacao Harvest Background" class="w-full h-full object-cover scale-105" data-alt="Close up of a vibrant, ripe yellow and orange cacao pod hanging from a lush green tree in a dense tropical rainforest setting with soft, diffused sunlight" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDYlfcj6qqbO0tKamuwuGPCWsWfAUq6tzi2RrxOSj2mj6r_o41BBsFbmKOx7g9RTI1-P1y3Z74dzAie6ndsLqB5e_d1R25rOfVz9ioj-Fg5W_q6PfpheF1wLtUuU2j5PvvuqFXUrxhrtF1hoOSe62BgPRPxYFDI7KcuDWncvv9b7_ARc5h4dCFicz5hE_l9XB871jcFYgEMLgbZkdg0ze7lUiKVdf5nBT9rkP_jnmVcotjpRNOvbQhV-y94ufX2oaOkfjV1mQm3m2hE"/>
<!-- Tonal Overlays for Depth and Readability -->
<div class="absolute inset-0 bg-primary/60 mix-blend-multiply"></div>
<div class="absolute inset-0 bg-gradient-to-t from-primary/95 via-primary/50 to-transparent"></div>
</div>
<!-- Main Content Container (Suppressed Navigation Shell per Rules) -->
<main class="relative z-10 flex min-h-screen flex-col items-center justify-center p-6 sm:p-12">
<!-- Glassmorphism Registration Card -->
<div class="w-full max-w-xl rounded-[2rem] bg-surface/85 backdrop-blur-2xl p-8 shadow-[0_8px_32px_rgba(1,38,31,0.15)] sm:p-12">
<!-- Header Section -->
<div class="mb-10 text-center">
<span class="font-headline text-sm font-bold tracking-[0.2em] text-tertiary uppercase block mb-4">The Living Archive</span>
<h1 class="font-headline text-4xl sm:text-5xl text-primary leading-tight">Join the Marketplace</h1>
<p class="font-body text-on-surface-variant mt-4 text-base">Register to discover authentic organic heritage.</p>
</div>
<!-- Registration Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Full Name -->
<div class="relative">
<label class="font-label text-sm font-medium text-tertiary block mb-2 ml-4" for="name">Full Name</label>
<input class="w-full rounded-xl bg-surface-container-low px-5 py-4 font-body text-base text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-container transition-liquid border-none ring-0 focus:ring-0" id="name" name="name" placeholder="e.g. Elena Dominguez" required="" type="text"/>
</div>
<!-- Email -->
<div class="relative">
<label class="font-label text-sm font-medium text-tertiary block mb-2 ml-4" for="email">Email Address</label>
<input class="w-full rounded-xl bg-surface-container-low px-5 py-4 font-body text-base text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-container transition-liquid border-none ring-0 focus:ring-0" id="email" name="email" placeholder="elena@example.com" required="" type="email"/>
</div>
<!-- Phone -->
<div class="relative">
<label class="font-label text-sm font-medium text-tertiary block mb-2 ml-4" for="phone">Phone Number</label>
<input class="w-full rounded-xl bg-surface-container-low px-5 py-4 font-body text-base text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-container transition-liquid border-none ring-0 focus:ring-0" id="phone" name="phone" placeholder="+57 300 000 0000" type="tel"/>
</div>
<!-- Password -->
<div class="relative">
<label class="font-label text-sm font-medium text-tertiary block mb-2 ml-4" for="password">Password</label>
<input class="w-full rounded-xl bg-surface-container-low px-5 py-4 font-body text-base text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-container transition-liquid border-none ring-0 focus:ring-0" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Action Area -->
<div class="pt-6">
<button class="group w-full rounded-full bg-primary py-5 px-8 font-body text-lg font-bold text-on-primary shadow-[inset_0_2px_0_rgba(255,255,255,0.15),0_8px_16px_rgba(1,38,31,0.2)] hover:bg-primary-container transition-liquid flex items-center justify-center gap-3" type="submit">
                        Join the Marketplace
                        <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform duration-500">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center font-body text-sm text-on-surface-variant">
                Already part of the archive? 
                <a class="font-bold text-primary hover:text-secondary transition-colors duration-300 ml-1 underline decoration-2 underline-offset-4 decoration-primary/30 hover:decoration-secondary" href="/login">Login</a>
</div>
</div>
</main>
</body></html>
